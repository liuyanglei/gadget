name: Update finance news

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/update-news.yml"
      - "crawler/**"
      - "data/settings.json"
  schedule:
    # Beijing time (UTC+8): 08:17, 12:17, 16:17, 20:17.
    # Avoid the top of the hour, when GitHub's schedule queue is busiest.
    - cron: "17 0,4,8,12 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-finance-news
  cancel-in-progress: false

jobs:
  update-news:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: crawler/requirements.txt

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends poppler-utils tesseract-ocr tesseract-ocr-chi-sim antiword libreoffice-calc
          python -m pip install --disable-pip-version-check -r crawler/requirements.txt

      - name: Collect finance news
        run: python crawler/spider.py

      - name: Validate generated data
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path("data/news.json").read_text(encoding="utf-8"))
          articles = payload.get("articles", [])
          assert articles, "crawler produced no articles"
          assert all(len(str(item.get("content", ""))) >= 180 for item in articles), "incomplete article found"
          assert len({item.get("id") for item in articles}) == len(articles), "duplicate article id found"
          print(f"Validated {len(articles)} complete articles")
          PY

      - name: Commit updated data
        run: |
          if git diff --quiet -- data/news.json; then
            echo "No news changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/news.json
          git commit -m "chore: update finance news"
          git pull --rebase origin main
          git push
